# Overlay. Do not add gtk, tokio, winit, wgpu, fyne, or khronos-egl.
[package]
name = "df-hud"
version = "0.3.1"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Dead Frontier overlay (GLES / WGL)"

[dependencies]
# serde + toml only; no notify, no toml_edit.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# rustls, not native-tls/openssl.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Hinted LCD atlas. Pure Rust; no Fontconfig/Pango/FreeType.
swash = { version = "0.2", features = ["scale", "render"] }
# One renderer on both surfaces. Linux: GLES 3.0 via libEGL. Windows: GL 3.3 via WGL.
glow = "0.16"
# Runtime GL/EGL. khronos-egl 6.0.0 did not compile on rustc 1.97; keep this.
libloading = "0.8"
# Tray reticle PNG. Small encoder; not a GUI toolkit.
png = "0.17"
# One argv walk. No clap; optional --print-view PATH is a peek, not a second parser.
lexopt = "0.3"

# Mesa EGL on a layer surface needs a libwayland wl_surface*. That is the
# wayland-backend client_system feature (FFI for EGL), not GTK.
[target.'cfg(target_os = "linux")'.dependencies]
# SNI via zbus. async-io + blocking: no tokio (forbidden in CI).
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# HWND / DWM / WGL. Feature-gated windows-sys, not the kitchen-sink windows crate.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
