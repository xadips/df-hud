# Product crate. Everyday tests stay here; .github/workflows/ci.yml packages
# on tags. Artifacts stay Ubuntu + rustup + MinGW (not zigbuild); the
# windows-latest job only executes the tests a cross-compile can just type-check.
name: Product crate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux-gnu-and-windows-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mesa gives the render smoke test a surfaceless llvmpipe context.
      - name: Install Wayland headers, MinGW, and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            libegl1 \
            libegl-mesa0 \
            libgles2 \
            libgl1-mesa-dri

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # A prebuilt binary, not the Docker action: that one ships its own older
      # toolchain and re-downloads stable plus the Windows std on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Supply chain (advisories, licenses, bans, sources)
        run: cargo deny check

      # deny.toml owns the crate bans. Only per-target rules live here.
      - name: Check the resolved tree per target
        run: |
          set -euo pipefail
          linux_tree="$(cargo tree --target x86_64-unknown-linux-gnu --edges no-dev --prefix none)"
          printf 'linux-gnu tree:\n%s\n' "$linux_tree"
          win_tree="$(cargo tree --target x86_64-pc-windows-gnu --edges no-dev --prefix none)"
          printf 'windows-gnu tree:\n%s\n' "$win_tree"
          if printf '%s\n' "$win_tree" | grep -Ei '^wayland'; then
            echo "wayland crates must stay behind a linux target gate"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^swash '; then
            echo "windows-gnu should include swash"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^glow '; then
            echo "windows-gnu should include glow"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^libloading '; then
            echo "windows-gnu should include libloading"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^windows-sys '; then
            echo "windows-gnu should include windows-sys"
            exit 1
          fi
          if ! printf '%s\n' "$linux_tree" | grep -q '^serde '; then
            echo "linux-gnu should include serde"
            exit 1
          fi
          if ! printf '%s\n' "$linux_tree" | grep -q '^toml '; then
            echo "linux-gnu should include toml"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^serde '; then
            echo "windows-gnu should include serde"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^toml '; then
            echo "windows-gnu should include toml"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy linux-gnu
        run: cargo clippy --locked --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Clippy windows-gnu
        run: cargo clippy --locked --target x86_64-pc-windows-gnu -- -D warnings

      - name: Test linux-gnu
        env:
          # A quietly skipped render test would erase the only GL coverage.
          DF_HUD_REQUIRE_RENDER_TEST: "1"
        run: cargo test --locked --target x86_64-unknown-linux-gnu

      - name: Compile windows-gnu tests
        run: cargo test --locked --no-run --target x86_64-pc-windows-gnu

  # The release artifact stays MinGW; this runs the windows-gated logic (tray
  # menu, autostart, registry, creds) that the cross-target can never execute.
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test windows-msvc
        run: cargo test --locked
