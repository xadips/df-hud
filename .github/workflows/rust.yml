# Product crate. Everyday tests stay here; .github/workflows/ci.yml packages
# on tags. Ubuntu + rustup + MinGW; not zigbuild, not windows-latest.
name: Product crate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux-gnu-and-windows-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Wayland headers and MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libwayland-dev \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Reject GUI / async crates
        run: |
          set -euo pipefail
          if grep -E '^name = "(gtk|gdk|gotk|libadwaita|tokio|winit|wgpu|iced|egui|slint|reqwest|fyne|khronos-egl)"' Cargo.lock; then
            echo "forbidden crate in Cargo.lock"
            exit 1
          fi
          linux_tree="$(cargo tree --target x86_64-unknown-linux-gnu --edges no-dev --prefix none)"
          printf 'linux-gnu tree:\n%s\n' "$linux_tree"
          if printf '%s\n' "$linux_tree" | grep -Ei '^(gtk|gdk|gotk|libadwaita|tokio|winit|wgpu|iced|egui|slint|reqwest|fyne|khronos-egl) '; then
            echo "forbidden crate in linux-gnu tree"
            exit 1
          fi
          win_tree="$(cargo tree --target x86_64-pc-windows-gnu --edges no-dev --prefix none)"
          printf 'windows-gnu tree:\n%s\n' "$win_tree"
          if printf '%s\n' "$win_tree" | grep -Ei '^(wayland|gtk|gdk|gotk|libadwaita|tokio|winit|wgpu|iced|egui|slint|reqwest|fyne|khronos-egl) '; then
            echo "forbidden crate in windows-gnu tree"
            exit 1
          fi
          if printf '%s\n' "$win_tree" | grep -E '^windows '; then
            echo "kitchen-sink windows crate is forbidden; use windows-sys"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^swash '; then
            echo "windows-gnu should include swash"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^glow '; then
            echo "windows-gnu should include glow"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^libloading '; then
            echo "windows-gnu should include libloading"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^windows-sys '; then
            echo "windows-gnu should include windows-sys"
            exit 1
          fi
          if ! printf '%s\n' "$linux_tree" | grep -q '^serde '; then
            echo "linux-gnu should include serde"
            exit 1
          fi
          if ! printf '%s\n' "$linux_tree" | grep -q '^toml '; then
            echo "linux-gnu should include toml"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^serde '; then
            echo "windows-gnu should include serde"
            exit 1
          fi
          if ! printf '%s\n' "$win_tree" | grep -q '^toml '; then
            echo "windows-gnu should include toml"
            exit 1
          fi

      - name: Test linux-gnu
        run: cargo test --locked --target x86_64-unknown-linux-gnu

      - name: Check windows-gnu
        run: cargo check --locked --target x86_64-pc-windows-gnu
