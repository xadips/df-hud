name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Wayland headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked

  build-linux:
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Wayland headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev+${GITHUB_SHA::12}"
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux archive
        run: make package-linux VERSION="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: df-hud-${{ steps.version.outputs.version }}-linux-amd64
          path: dist/df-hud-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
          if-no-files-found: error

  build-windows:
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            zip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev+${GITHUB_SHA::12}"
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build Windows archive
        run: make package-windows VERSION="$VERSION"
      - name: Verify Windows package
        run: |
          archive="dist/df-hud-$VERSION-windows-amd64.zip"
          stage="dist/df-hud-$VERSION-windows-amd64"
          unzip -Z1 "$archive" | sort > package-files.txt
          printf '%s\n' LICENSE df-hud.exe df-hud.example.toml | sort > expected-files.txt
          diff -u expected-files.txt package-files.txt

          x86_64-w64-mingw32-objdump -p "$stage/df-hud.exe" \
            | awk '/DLL Name:/ { print tolower($3) }' > imports.txt
          if awk '/gtk|glib|gobject|cairo|pango/ { found=1 } END { exit !found }' imports.txt; then
            echo "unexpected GTK dependency:"
            awk '/gtk|glib|gobject|cairo|pango/' imports.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: df-hud-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/df-hud-${{ steps.version.outputs.version }}-windows-amd64.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: df-hud-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "df-hud-$version-linux-amd64.tar.gz" \
            "df-hud-$version-windows-amd64.zip" \
            --generate-notes \
            --title "df-hud ${GITHUB_REF_NAME#v}"
