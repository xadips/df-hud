name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-linux:
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Linux build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            go \
            gobject-introspection \
            gtk4-layer-shell
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check
        env:
          CGO_ENABLED: "1"
        run: make check

  test-windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test and build native Windows frontend
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./... -count=1
          go build -trimpath -buildvcs=false -ldflags "-H=windowsgui" -o df-hud.exe ./cmd/df-hud

  build-linux:
    needs: [check-linux, test-windows-native]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:base
    steps:
      - name: Install Linux build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            git \
            go \
            gobject-introspection \
            gtk4-layer-shell
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev+${GITHUB_SHA::12}"
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build Linux archive
        env:
          CGO_ENABLED: "1"
        run: make package-linux VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: df-hud-${{ steps.version.outputs.version }}-linux-amd64
          path: dist/df-hud-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
          if-no-files-found: error

  build-windows:
    needs: [check-linux, test-windows-native]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows resource tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            unzip \
            zip
      - name: Set version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-dev+${GITHUB_SHA::12}"
          fi
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build Windows archive
        run: make package-windows VERSION="$VERSION"
      - name: Verify native Windows package
        run: |
          archive="dist/df-hud-$VERSION-windows-amd64.zip"
          stage="dist/df-hud-$VERSION-windows-amd64"
          unzip -Z1 "$archive" | sort > package-files.txt
          printf '%s\n' LICENSE df-hud.exe df-hud.example.toml | sort > expected-files.txt
          diff -u expected-files.txt package-files.txt

          x86_64-w64-mingw32-objdump -p "$stage/df-hud.exe" \
            | awk '/DLL Name:/ { print tolower($3) }' > imports.txt
          if awk '/gtk|glib|gobject|cairo|pango|msys|libgcc|libstdc|libwinpthread/ { found=1 } END { exit !found }' imports.txt; then
            echo "unexpected GTK/MSYS dependency:"
            awk '/gtk|glib|gobject|cairo|pango|msys|libgcc|libstdc|libwinpthread/' imports.txt
            exit 1
          fi

          go version -m "$stage/df-hud.exe" > modules.txt
          if awk '/gotk4/ { found=1 } END { exit !found }' modules.txt; then
            echo "Windows executable still links gotk4"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: df-hud-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/df-hud-${{ steps.version.outputs.version }}-windows-amd64.zip
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: df-hud-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "df-hud-$version-linux-amd64.tar.gz" \
            "df-hud-$version-windows-amd64.zip" \
            --generate-notes \
            --title "df-hud ${GITHUB_REF_NAME#v}"
