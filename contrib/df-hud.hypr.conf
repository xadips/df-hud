# Optional Hyprland layer rules for df-hud's default namespace.
#
# Hotkeys belong in [hotkeys] in config.toml. The binary installs and focus-gates
# those chords itself; do not duplicate them with compositor binds.
#
# Source this file from hyprland.conf if the overlay should never animate or blur:
#   source = ~/Programming/df-hud/contrib/df-hud.hypr.conf
layerrule = noanim, df-hud
layerrule = noblur, df-hud
layerrule = ignorealpha 0, df-hud
