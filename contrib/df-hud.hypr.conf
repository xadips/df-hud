# df-hud keybinds and layer rules for Hyprland.
#
# Add one line to your hyprland.conf:
#
#   source = ~/Programming/df-hud/contrib/df-hud.hypr.conf
#
# If you use Hyprland's Lua configuration, use df-hud.lua next to this file
# instead - it is the same binds in that dialect, and it can do one thing this
# file cannot: arm the keys ONLY while Dead Frontier is focused, so SUPER + ALT + D
# is free for your other windows. This dialect has no per-window bind filter, no
# event subscriptions and no way to enable a bind conditionally.
#
# The nearest thing here is a guard inside the command, which needs jq and spawns
# two processes per keypress (fine for a key, not for the click bind at the bottom):
#
#   bind = SUPER ALT, D, exec, hyprctl activewindow -j | jq -e '.class|ascii_downcase|contains("deadfrontier")' >/dev/null && curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/widget/map/toggle
#
# The key still EXISTS everywhere with that - it just does nothing elsewhere - so it
# is not a way to free the combination up for another program.
#
# The keys live here rather than in df-hud's own config because a Wayland client
# cannot grab a global hotkey - the compositor owns them, by design. df-hud
# publishes each action on its loopback listener instead, so the binding is yours
# to choose and needs no restart of df-hud to change.
#
# Change the port if you changed bridge.listen.

$dfhud = http://127.0.0.1:9275

# Not the function keys: Dead Frontier uses those itself.

# Start the run clock from now.
#
# The clock is inferred from activity otherwise, and that can be late: nothing in
# the player record marks the client taking control, and a whole loot run can
# happen inside one block without moving. Press this as you press Start.
bind = SUPER ALT, T, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/run/start

# Start the xp/hr average again from now, after a challenge reward drops a lump of
# XP into the window and stops it answering "how fast am I killing".
bind = SUPER ALT, X, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/xp/reset

# Show or hide the overlay by hand. The automatic rules (only_when_game_running,
# follow_game_workspace) still apply on top of this.
bind = SUPER ALT, K, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/overlay/toggle

# Hide the challenge board without turning it off in the config. B for board. The
# endpoint takes the group's name, so block, bosses, session and xp work the same
# way if you want keys for them.
bind = SUPER ALT, B, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/widget/challenges/toggle

# The city map, which starts hidden: the whole 59x55 grid with an identifier on
# every active event and a ring on the block you are standing on. It is another
# widget group, so the mouse still reaches the game through it.
#
# Not M, which is the game's own map key. A consuming bind should stop the game ever
# seeing the keypress, but a client that polls raw key state does not care what else
# is held down, so pick a letter the game does nothing with.
bind = SUPER ALT, D, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/widget/map/toggle

# No bind for /api/console/toggle: the console does not exist yet (the endpoint
# answers 503), and SUPER + C is the window kill in the config this was written
# against, so a neighbouring SUPER + ALT + C is one slip from closing something.


# The overlay never wants to be dimmed or blurred by anything, and never wants
# animating - it is text over a game, redrawn every second.
layerrule = noanim, df-hud
layerrule = noblur, df-hud
layerrule = ignorealpha 0, df-hud
