# df-hud keybinds and layer rules for Hyprland.
#
# Add one line to your hyprland.conf:
#
#   source = ~/Programming/df-hud/contrib/df-hud.hypr.conf
#
# If you use Hyprland's Lua configuration, use df-hud.lua next to this file
# instead - it is the same binds in that dialect.
#
# The keys live here rather than in df-hud's own config because a Wayland client
# cannot grab a global hotkey - the compositor owns them, by design. df-hud
# publishes each action on its loopback listener instead, so the binding is yours
# to choose and needs no restart of df-hud to change.
#
# Change the port if you changed bridge.listen.

$dfhud = http://127.0.0.1:9275

# Not the function keys: Dead Frontier uses those itself.

# Start the run clock from now.
#
# The clock is inferred from activity otherwise, and that can be late: nothing in
# the player record marks the client taking control, and a whole loot run can
# happen inside one block without moving. Press this as you press Start.
bind = SUPER ALT, T, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/run/start

# Start the xp/hr average again from now, after a challenge reward drops a lump of
# XP into the window and stops it answering "how fast am I killing".
bind = SUPER ALT, X, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/xp/reset

# Show or hide the overlay by hand. The automatic rules (only_when_game_running,
# follow_game_workspace) still apply on top of this.
bind = SUPER ALT, O, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/overlay/toggle

# The console window, for the full challenge list and pin toggles.
bind = SUPER ALT, C, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/console/toggle

# OPTIONAL: start the run clock from the game's own Start button.
#
# bindn is non-consuming, so the click still reaches the game. That is also why
# this cannot be done from inside df-hud: a Wayland surface that receives a pointer
# event CONSUMES it, and the protocol has no forwarding - only the compositor can
# both act on a click and still deliver it, because it is the thing delivering it.
#
# df-hud never sees your input. It is told a click happened and then checks for
# itself whether the cursor was on the button, in the game's focused window, with no
# run already in progress. Configure the rectangle under [run_start].
#
# WARNING, and the reason this is commented out: a bind in hyprland.conf is GLOBAL.
# It fires on every left click you make all day, in every application, spawning a
# curl each time - not just in the game.
#
# hyprland.conf has no per-window bind filter and no way to enable a bind
# conditionally, so there is no fix for that in this dialect. The Lua version next
# to this file arms the bind only while the game is focused, using an event
# subscription and set_enabled; if you want this, use that.
#
# bindn = , mouse:272, exec, curl -fsS --max-time 2 -o /dev/null -X POST $dfhud/api/run/click

# The overlay never wants to be dimmed or blurred by anything, and never wants
# animating - it is text over a game, redrawn every second.
layerrule = noanim, df-hud
layerrule = noblur, df-hud
layerrule = ignorealpha 0, df-hud
