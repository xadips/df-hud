[package]
name = "linux-overlay-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway EGL + zwlr_layer_shell_v1 gate for the df-hud rewrite"

[dependencies]
glow = "0.16"
libc = "0.2"
libloading = "0.8"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-egl = "0.32"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
