# Supply chain gate. Per-target bans stay in the CI tree check.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# All permissive. Kept minimal so a new license fails the build.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Cargo.toml bans these at the top; this catches them arriving transitively.
deny = [
    { name = "egui" },
    { name = "fyne" },
    { name = "gdk" },
    { name = "gotk" },
    { name = "gtk" },
    { name = "iced" },
    { name = "khronos-egl" },
    { name = "libadwaita" },
    { name = "reqwest" },
    { name = "slint" },
    { name = "tokio" },
    { name = "wgpu" },
    { name = "windows" },
    { name = "winit" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
