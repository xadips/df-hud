# df-hud configuration.
#
# Copy to ~/.config/df-hud/config.toml and edit. Every value below is the
# built-in default, so an empty file (or no file at all) behaves exactly like
# this one, and you only need to keep the lines you actually change.
#
# Unknown keys are a startup ERROR, not a warning: a typo would otherwise look
# like a bug in df-hud rather than a bug in your config. Intervals below their
# minimum are also errors rather than being quietly raised, because they decide
# how often df-hud talks to somebody else's game server.
#
# Editing this file while df-hud is running reloads it. Three keys need a
# restart and are noted where they appear.

[df]
# The game's API root. Every request body carries your credentials, so this must
# be https.
base_url = "https://fairview.deadfrontier.com/onlinezombiemmo"

# The public, unauthenticated stats feed. df-hud reads the XP table and the
# block/neighbourhood grids from here, which is why Block Info needs no login
# beyond what the bridge already provides.
allstats_url = "https://fairview.deadfrontier.com/onlinezombiemmo/dfdata/get_allstats.php?printvars=1"

# Sent on every request. Defaults to "df-hud/<version> (+local overlay; contact
# via Dead Frontier forums)". Keep it honest and identifiable: it is what lets a
# server operator tell a local HUD apart from abuse, and contact you instead of
# banning you. Left commented so it stays version-stamped.
# user_agent = "df-hud/dev (+local overlay; contact via Dead Frontier forums)"

# Per-request timeout. Allowed range 2s..60s.
timeout = "10s"

# Signing salt for hashed calls (challenges). Normally leave this empty: the
# bridge userscript reports the live value from page context and a reported salt
# always wins, so the game rotating it heals itself. Set it only if you want
# challenges to work without the bridge script installed.
skeygen = ""

[bridge]
# The loopback listener the bridge userscript POSTs your session to. Both keys
# need a RESTART to change.
#
# This endpoint receives account-equivalent credentials, so a non-loopback
# address is refused at startup. Request bodies are never logged.
enabled = true
listen = "127.0.0.1:9275"

[poll]
# How often df-hud asks the game for your player record.
#
# active_interval applies while the game is running, idle_interval when it is
# not - so with only_when_game_running below (the default), idle_interval never
# applies at all and closing the game means zero requests.
#
# Deliberately NOT refined by whether you are in an outpost: that status is only
# known from the previous poll, so it would always be one poll stale, and it
# would delay noticing the outpost-to-city transition by a whole idle interval -
# right when the HUD matters most.
#
# Minimums: active 5s, idle 30s, challenges 30s, catalog 1h. Regardless of these,
# two requests are never sent less than 5s apart, so nothing that wakes df-hud
# (credentials arriving, the game launching) can turn into a burst.
active_interval = "10s"
idle_interval = "2m"

# The challenge board's cadence WHILE PLAYING. With the game closed nothing is
# generating challenge progress, so it stretches to idle_interval - a short value
# chosen for play cannot become an all-night poll if you turn
# only_when_game_running off.
challenge_interval = "30s"

catalog_interval = "24h"

# Fraction of the interval to randomise by, 0..0.5. Stops a restart loop from
# lining requests up and keeps the traffic from looking metronomic.
jitter = 0.10

# With this on, closing the game takes df-hud's traffic to exactly zero.
# Turning it off means it polls around the clock.
only_when_game_running = true

# Ceiling on the exponential backoff after transport failures. A rejected
# credential is not backed off from at all: polling stops until the bridge
# delivers a fresh session, because retrying a rejected login is precisely the
# pattern that earns a temp ban.
backoff_max = "5m"

[game]
# The client executable, matched against the first command-line argument's
# basename. It must be a bare name, not a path. The default is the Steam/Proton
# install's exe name.
#
# Detection is done from /proc rather than from the compositor: it decides
# whether df-hud polls at all, so it has to work on any compositor and it must
# not depend on a window existing (a Proton game spends a while with none).
process = "DeadFrontier.exe"

# The game WINDOW's class, which is a different question: it decides where the
# HUD is drawn (hud.follow_game_workspace, and monitor = "auto"), never whether
# df-hud polls.
#
# Empty means "look for a window whose process id matches, and failing that one
# whose class looks like game.process". Set it only if `df-hud -check-game` says
# the window could not be matched - it prints every window's class, so the fix is
# copying one of them in here.
window_class = ""

# How often /proc is scanned. This is a local read, not a network request, so
# there is no politeness floor - only sanity limits of 250ms..5m. Under Hyprland
# a window opening or closing also triggers an immediate rescan, so this is a
# backstop rather than the main path.
scan_interval = "2s"

[paths]
# Holds credentials.json (mode 0600), state.json and catalog.json.
# Defaults to $XDG_DATA_HOME/df-hud, i.e. ~/.local/share/df-hud.
# Needs a RESTART to change.
# data_dir = "~/.local/share/df-hud"

[hud]
enabled = true

# Hide the HUD entirely while the game is not running. Without this the overlay
# sits over your desktop all day showing a clock for a game nobody is playing.
#
# Named to match poll.only_when_game_running and deliberately separate from it:
# that one governs requests to somebody else's server, this one governs pixels on
# your own screen.
only_when_game_running = true

# Show the HUD only while the game's own workspace is the one on screen.
#
# The layer-shell protocol has no concept of a workspace - a layer surface belongs
# to a MONITOR and is drawn on every workspace of it - so this is emulated: df-hud
# asks the compositor which workspace the game's window is on and hides the
# surface while you are looking at a different one.
#
# It fails open. If the compositor cannot be reached, or the game's window cannot
# be identified (see game.window_class), the HUD is shown rather than hidden: a
# HUD that is wrongly visible is an annoyance you can see, while one that is
# wrongly invisible is indistinguishable from df-hud being broken.
follow_game_workspace = true

# Connector name ("DP-1", "HDMI-A-1"), or "auto".
#
# "auto" follows the GAME: the surface is pinned to whichever monitor the game's
# window is on, re-checked every time the HUD is shown. If the window cannot be
# identified, the compositor chooses, which in practice means the focused
# monitor. Name a connector explicitly to override that.
#
# An unknown name is a warning, not a failure: losing the HUD entirely because a
# connector got renamed after a cable swap would be a poor trade.
monitor = "auto"

# MUST be "overlay" to be visible over a fullscreen game: the "top" layer sits
# BELOW fullscreen surfaces, so a "top" HUD simply disappears when you play,
# which looks identical to df-hud being broken. The others exist for debugging.
layer = "overlay"

# The surface covers the whole monitor and each group of rows carries its own
# x/y under [widget.*], so a coordinate here means what it means in a
# screenshot. These margins inset the surface from each edge, which moves that
# origin: set margin_top if you want everything pushed below a bar, rather than
# adding the same offset to every group.
#
# There used to be an anchors key here, from when the HUD was one stack of rows
# in a corner. Per-group coordinates replaced it.
margin_top = 0
margin_right = 0
margin_bottom = 0
margin_left = 0

# Leave this on. The HUD sits on top of the game, so every pointer event it
# keeps is one the game does not get. Turn it off only to poke at the surface
# while debugging.
click_through = true

font_family = "Courier New, monospace"
font_size = 12
text_color = "#e6cc4d"
opacity = 1.0

# Optional extra stylesheet, loaded after the built-in one, so you can restyle
# without rebuilding. Must exist if set.
# css = "~/.config/df-hud/style.css"

[bossmap]
# What is standing on your block: bosses, bandit packs, missions, QRF events and
# outpost attacks. Shown as an extra line under the block name.
#
# This is the only thing df-hud fetches from a site that is not the game's own.
# The game's API knows where YOU are and the public stats feed knows the map's
# geometry, but neither knows what has spawned on it; dfprofiler publishes that.
#
# There is no fixed cadence. The feed states when every event starts and ends, so
# the schedule comes from the data: a fetch shortly after the next changeover, one
# when you arrive on a new block (the only question this feed answers), and
# otherwise a heartbeat for the once-a-day random spawns that nothing predicts.
#
# Most cycles turn over on the hour, and the feed carries the NEXT cycle from
# around :59 and keeps the previous one for a few minutes after :00. df-hud reads
# each event's own start and end times against the clock, so a changeover costs no
# request at all - one fetch stays correct straight through it.
#
# interval is the MINIMUM gap between fetches, not the cadence. Its floor is 30s,
# which is what dfprofiler's own boss map page polls at per open tab: df-hud must
# never cost the operator more than their own page does. Nothing is fetched at all
# while the game is not running.
enabled = true
url = "https://www.dfprofiler.com/bossmap/json/"
interval = "1m"
max_interval = "5m"

[tray]
# The icon in the system tray (waybar's "tray" module, or any other
# StatusNotifierItem host), with a menu for hiding the overlay, reloading this
# file and quitting.
#
# Worth leaving on: with only_when_game_running above, df-hud has no presence on
# screen at all while you are not playing, and this is then the only way to tell
# it is running or to stop it.
enabled = true

# Widgets. Each has enabled and order; order is a sort key, not an index, so the
# gaps are deliberate - reorder by editing one number.

# --- widgets -----------------------------------------------------------------
#
# Each group has its own place on screen. x and y are pixels from the top-left,
# measured the way you would measure them on a screenshot, and the defaults below
# were set at 2560x1440 against the game's own interface - so on another
# resolution they are the first thing to change.
#
# font_family, font_size and color are optional per group. Zero, absent or empty
# means "use the [hud] values", so a group only needs the keys it differs on.
#
# A group's color is its NORMAL colour. The colours that carry meaning still win
# over it: the error banner's red, an outpost attack's red, the amber on a block
# with bandits on it, and the amber or red on an xp rate whose polls have been
# landing badly. Those say something the words do not, so a colour preference does
# not switch them off.

[widget.status]
# df-hud's own error banner: stale credentials, a board it cannot fetch.
#
# Two keys it deliberately does not have. No enabled, because this is how df-hud
# tells you it cannot do its job. And no color: the banner is red when you cannot
# fix it and amber when you can, which is the whole message.
x = 10
y = 10

[widget.block]
# Where you are: the region or outpost name, and the block-support countdown. Off
# to the right, clear of the game's own left-hand panels.
enabled = true
x = 2340
y = 300
# font_size = 14

# Cool blue, because the amber below it means "something here can kill you". Where
# you are standing is not a warning and should not borrow the colour of one.
color = "#9ecbff"

# Print the raw coordinates: as the head out in the city, and under the name of an
# outpost.
#
# Off, because the game already shows them under its own minimap and two identical
# readouts an inch apart is not information. With it off the city head becomes the
# region name, which the game shows nowhere - and the group is one row shorter.
#
# Turn it on while calibrating the area grid.
show_position = false

[widget.bosses]
# What the city event feed says is on your block - bosses, bandit packs, missions,
# QRF events - one row per enemy type, plus the map-wide outpost attack.
#
# Its own group rather than part of block info, and directly under it by default:
# this is a list that is empty on most of the map and seven rows long on a boss
# nest, so anything sharing its group would move up and down as you travelled.
#
# The amber that says "something is standing here" and the red of an outpost attack
# win over color, since those say what the words do not.
# Left of block info, and close under it. These rows are the longest thing the HUD
# draws: "1 x Irradiated Giant Spider" at x = 2340 finished thirteen pixels from the
# edge of a 2560-wide screen, and a group is clipped rather than wrapped.
enabled = true
x = 2240
y = 344
# font_size = 14
# color = "#ffd166"

# When your own block is empty - which is most blocks - say which way the nearest
# event is, in block moves and then as the block's own coordinates:
#
#   nearest 4 up 1 left  1054, 1015
#
# Both forms on purpose. The words are what you read at a glance; the coordinates
# are what the game itself shows you, so they are also how you would catch "up"
# being the wrong way round. Anything further than a dozen blocks is not reported:
# it would be furniture rather than information.
show_nearest = true

[widget.session]
# Time in the inner city on this run: it starts when you press Start (see
# [run_start]) or when the server first reports you out of an outpost, and the row
# disappears when you go back to one.
#
# Deliberately NOT the game client's uptime. Launching Dead Frontier means a
# launcher, then Launch, then a loading screen, then Start - so process uptime can
# be minutes ahead of any playing, and a clock counting that is timing a loading
# screen.
#
# The run survives a df-hud restart mid-session (it is persisted with the game's
# process identity), so restarting the HUD does not reset your clock.
enabled = true
x = 350
y = 60
# font_size = 16
# White, because the game's own HUD is already yellow and green: a reading that is
# neither a warning nor a status should read as ours rather than as more of the
# game's.
color = "#ffffff"
# Labels the clock. A bare number on an overlay over a game that has its own
# clocks says nothing about what it is timing. Set it to "" for just the digits.
prefix = "IC Time: "

[widget.xp]
enabled = true
x = 160
y = 85
# White to match the clock, and because this row sits beside the game's own
# "LV 415: 8,122,281,000" and is meant to read as its continuation.
color = "#ffffff"
# font_size = 16
# The amber and red that say recent polls have been missing still win over this.
# color = "#9be564"
prefix = "Xp/Hr: "
# Averaging window, and the number of usable samples below which the rate is
# left blank rather than extrapolated from too little data. The window must be
# long enough to hold min_samples at active_interval; if it is not, it widens
# rather than being rejected, and the startup log says so.
#
# Five minutes, not thirty seconds, because XP arrives in lumps: a window short
# enough to contain no kill reads as a rate of zero, and a number that flips
# between 20M/hr and nothing is actively misleading about how the run is going.
# Shorten it if you want the rate to react faster and can live with it twitching.
#
# The window is reset, not averaged across, whenever the samples either side stop
# being comparable: a new run, a death, an XP boost starting or ending, a clock
# jump, or a long gap.
window = "5m"
min_samples = 3

[widget.challenges]
# The whole board, in the board's own order.
enabled = true
x = 10
y = 190
# font_size = 11
# Off-white rather than white: this is the longest column on screen, and the green
# and red it marks finished and expiring rows with need somewhere quiet to stand
# out from.
color = "#e8e8e8"

# Which parts of the board are worth a row. Each is a category rather than a
# guess at what matters:
#
#   show_repeatable      limited-time event challenges, currently the Summer ones.
#                   The wire marks these `repeatable`; they pay event currency
#                   rather than XP, so turn this off if you are not collecting
#                   tickets.
#   show_clan       your clan's challenges. Progress that is not yours.
#   show_personal   the ordinary dailies and weeklies.
#   show_completed  cuts across all three: a finished challenge is a row that
#                   will not change again this cycle.
show_repeatable = true
show_clan = true
show_personal = true
show_completed = true

# Cap on rows, or 0 for no cap. The group has its own place on screen, so the
# whole board fits and there is nothing to crop around.
max_shown = 0

# How close a deadline has to be before an UNFINISHED challenge is drawn in the
# alarm colour, 0 to turn that off. Finished ones are green and struck through
# whatever this says.
#
# A display threshold rather than a request interval, so it has no minimum - but it
# is a key because "soon" depends on how you play: two hours is plenty for a daily
# kill count and nowhere near enough for a weekly you have not started.
urgent_within = "2h"

# The listener also exposes the two corrections the tray menu offers, so a key can
# do them without taking a hand off the mouse:
#
#   bind = SUPER, F2, exec, curl -fsS -X POST http://127.0.0.1:9275/api/run/start
#   bind = SUPER, F3, exec, curl -fsS -X POST http://127.0.0.1:9275/api/xp/reset
#
# /api/run/start is the answer to "start the clock exactly when I press Start in
# the game", and it is deliberately a trigger rather than a detector. If you would
# rather catch the click itself, Hyprland can do it without df-hud watching your
# input at all - bindn passes the click through to the game as well as firing:
#
#   bindn = , mouse:272, exec, ~/.config/hypr/df-run-start.sh
#
# with a script that checks it was the right window and the right part of the
# screen before calling the endpoint:
#
#   #!/bin/sh
#   [ "$(hyprctl activewindow -j | jq -r .class)" = "deadfrontier.exe" ] || exit 0
#   eval "$(hyprctl cursorpos | awk -F", " '"'"'{print "x="$1" y="$2}'"'"')"
#   # the Start button, measured once at your resolution
#   [ "$x" -gt 1100 ] && [ "$x" -lt 1460 ] && [ "$y" -gt 800 ] && [ "$y" -lt 880 ] || exit 0
#   curl -fsS -X POST http://127.0.0.1:9275/api/run/start
#
# Worth knowing before you do: that fires on every left click, so it spawns a
# process per shot fired, and the coordinates move with your resolution and with
# any UI change the game ships. A key you press as you press Start has neither
# problem.

[console]
# The console is an ordinary window (not an overlay), for the things a
# click-through HUD cannot do: the full challenge list, pin checkboxes,
# diagnostics. Bind a key to toggle it:
#
#   bind = SUPER, F1, exec, curl -fsS -X POST http://127.0.0.1:9275/api/console/toggle
width = 720
height = 560
