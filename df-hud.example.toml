# df-hud configuration. Copy to ~/.config/df-hud/config.toml and edit.
# Every value below is a built-in default: keep only the lines you change.
# Unknown keys and intervals below their floor are startup errors.
# Saving the file while df-hud runs reloads it; keys marked RESTART need one.
# Details and reasoning: docs/configuration.md and docs/widgets/.

[df]
# The game's API root. Request bodies carry credentials, so https only.
base_url = "https://fairview.deadfrontier.com/onlinezombiemmo"

# Public stats feed: XP table and map geometry.
allstats_url = "https://fairview.deadfrontier.com/onlinezombiemmo/dfdata/get_allstats.php?printvars=1"

# Sent on every request. Keep it identifiable so a server operator can tell a
# local HUD from abuse. Commented so it stays version-stamped.
# user_agent = "df-hud/dev (+local overlay; contact via Dead Frontier forums)"

# Per-request timeout, 2..60 seconds.
timeout = 10

# Signing salt for hashed calls (challenges, masteries). Leave empty: the
# bridge script reports the live value, and a reported salt wins.
skeygen = ""

# Numeric account id, a fallback when the bridge script is not installed:
# public stats only, no challenge board or masteries. A bridge session wins.
user_id = ""

[bridge]
# Loopback listener the bridge userscript POSTs your session to. Non-loopback
# addresses are refused. Both keys RESTART.
enabled = true
listen = "127.0.0.1:9310"

[poll]
# Player record cadence: active while the game runs, idle while it does not.
# Floors: active 5, idle 30, challenges 30, masteries 30, catalog 3600. On top
# of these, two requests are never sent less than 1s apart.
active_interval = 10
idle_interval = 120

# Challenge board and masteries cadence WHILE PLAYING; both stretch to
# idle_interval when the game is closed. Masteries poll only while
# [widget.masteries] is enabled.
challenge_interval = 30
mastery_interval = 30

catalog_interval = 86400

# Fraction of each interval to randomise by, 0..0.5.
jitter = 0.10

# On: closing the game takes df-hud's traffic to exactly zero.
only_when_game_running = true

# Backoff ceiling after transport failures. Rejected credentials are never
# retried; polling stops until the bridge delivers a fresh session.
backoff_max = 300

[game]
# Client executable, matched by basename. Decides whether df-hud polls at all.
process = "DeadFrontier.exe"

# The game WINDOW's class; decides where the HUD is drawn, never polling.
# Empty matches by pid, then by class. `df-hud -check-game` prints candidates.
window_class = ""

# Titles that are NOT the game despite carrying its class: the launcher's
# dialogs share the game's class and pid.
window_title_ignore = ["configuration"]

# Local process scan period, 1..300 seconds. Not a network request.
scan_interval = 1

[game_keys]
# Press the game's FPS key after its window appears - the readout starts off
# on every launch and nothing remembers it. Tray: "FPS display on launch".
fps_display = false
fps_key = "y"
# Seconds after the game WINDOW appears, not after the process starts.
fps_delay = 5

# Press Play on the launcher dialog when it appears. DISMISSED, not skipped:
# the dialog is what applies your input rebinds, so skipping it reverts them.
# Turn off to reach the Input tab. Tray: "Skip the launcher".
dismiss_launcher = false
launcher_key = "Return"
# Only this window gets the key; the "Input Configuration" box must not.
launcher_title = "Dead Frontier Configuration"
launcher_delay = 1

[hotkeys]
# Grabbed only while the game window is focused. Windows: RegisterHotKey.
# Linux: installed on Hyprland; do not duplicate them in compositor binds.
enabled = true

# A bare key is consumed before the game sees it, and a modifier does not
# hide the letter. Defaults are keys the game does not use. "" leaves an
# action unbound; chords like Ctrl+Shift+M work. The masteries key is only
# grabbed while [widget.masteries] is enabled.
map = "G"
challenges = "Z"
masteries = "4"
run_start = "K"
xp_reset = "U"
overlay = "J"

[paths]
# Holds credentials.json, state.json and catalog.json. RESTART.
# Defaults to ~/.local/share/df-hud (Linux) or %LOCALAPPDATA%\df-hud (Windows).
# data_dir = "~/.local/share/df-hud"

[hud]
# Master switch. Tray, hotkey and HTTP toggles cannot override false.
enabled = true

# Hide the pixels while the game is not running. poll.only_when_game_running
# is the separate network switch.
only_when_game_running = true

# Show the HUD only while the game's workspace is on screen. Fails open: if
# the compositor or the game window cannot be found, the HUD stays visible.
follow_game_workspace = true

# Connector name ("DP-1"), or "auto" = the monitor the game's window is on.
monitor = "auto"

# MUST stay "overlay": "top" sits below fullscreen surfaces and vanishes in
# play. RESTART.
layer = "overlay"

# Inset the surface from each edge; moves the origin every widget measures
# from, e.g. margin_top pushes everything below a bar.
margin_top = 0
margin_right = 0
margin_bottom = 0
margin_left = 0

# Empty uses the bundled JetBrains Mono Bold. A path, or a filename searched
# in the usual font dirs, e.g. "IosevkaTerm-Bold.ttf".
font = ""
font_size = 12
text_color = "#e6cc4d"
opacity = 1.0

# Widget coordinates are authored in this design space, then scaled to the
# panel. A first-run config stamps these from the current panel and rescales
# the coordinates below to match.
reference_width = 2560
reference_height = 1440

[bossmap]
# What is standing on your block, from dfprofiler's event feed - the only
# non-game site df-hud talks to. Their own page polls at 30s per open tab,
# the rate worth staying near; interval floors at 15s. onslaught_interval
# applies in Onslaught, whose cycle is 300s against the city's 3600.
# max_interval and onslaught_max_interval are unused; they stay so existing
# configs keep loading.
enabled = true
url = "https://www.dfprofiler.com/bossmap/json/"
interval = 60
max_interval = 300
onslaught_interval = 30
onslaught_max_interval = 60

[presence]
# Position from the game CLIENT via its Discord rich presence pipe (Discord
# itself is not needed): updates every block, where the poll lags 15-25s and
# skips blocks. The poll takes back over if the client goes quiet. Proton
# needs the pipe bridged - see knowledge/presence.md. Both keys RESTART.
enabled = true

# Empty is the default discord-ipc-0 endpoint.
socket = ""

[tray]
# Tray icon and menu. With only_when_game_running on, this is the only sign
# df-hud is running while the game is closed. RESTART.
enabled = true

# --- widgets -----------------------------------------------------------------
#
# y is from the top. x is from the left, or an inset from the right edge with
# anchor = "right". font_size 0 and color "" inherit from [hud]. A group's
# color is its normal colour; the alarm colours (red, amber, done-green) win.

[widget.status]
# df-hud's own banner: amber when you can fix it, red when you cannot. No
# enabled or color key on purpose.
anchor = "center"
x = 0
y = 10
font_size = 0

[widget.block]
# Region or outpost name, and the block-support countdown.
enabled = true
anchor = "right"
x = 220
y = 300
font_size = 0
color = "#9ecbff"

# The game already shows coordinates under its own minimap.
show_position = false

[widget.bosses]
# What is on your block, one row per enemy type, plus the outpost attack.
# In Onslaught this becomes the last/now/next panel.
enabled = true
anchor = "right"
x = 320
y = 344
font_size = 0
color = ""

# When your block is empty, point at the nearest event.
show_nearest = true

[widget.keybinds]
# Live [hotkeys] cheat sheet. Starts shown; tray "Show keybinds" hides it for
# this run, enabled = false for good.
enabled = true
anchor = "right"
x = 220
y = 530
font_size = 0
color = "#a0a0a0"

[widget.session]
# Run clock: elapsed since the run started.
enabled = true
anchor = "left"
x = 350
y = 60
font_size = 0
color = "#ffffff"
prefix = "IC Time: "

[widget.xp]
enabled = true
anchor = "left"
x = 220
y = 80

# White to read as a continuation of the game's own level line. The amber and
# red that say recent polls have been missing still win.
color = "#ffffff"
font_size = 0
prefix = "Xp/Hr: "

# Averaging window, and the sample count below which the rate stays blank.
# XP arrives in lumps, so shorter windows twitch. The window resets on a new
# run, a death, a boost edge, a clock jump, or a long gap.
window = 60
min_samples = 3

[widget.map]
# The city grid, shaded like DFProfiler's map. STARTS HIDDEN - hotkeys.map
# (default G) summons it. Clicks pass through to the game.
enabled = true

# Centre on the monitor, ignoring x/y below.
center = true

# Top-left of the grid when center = false.
x = 700
y = 240

# Nudge the centred map in pixels; negative is left and up. Ignored when
# center = false.
offset_x = -100
offset_y = 350

# Crop to a square this many blocks around you; 0 is the whole city. Cropping
# ZOOMS IN: the pixel budget spreads over fewer blocks.
radius = 8

# Size of grid and key together; 1.0 is 1180px across the longest side.
scale = 0.4

# Multiplies the map's own partial alpha. Markers are never faded.
opacity = 0.9

# The key beside the grid, sorted nearest first. The shared city hour prints
# once, on the nearest row.
show_list = true

# Cap on entries, 0 for none; the rest is counted ("+3 more").
max_listed = 10

font_size = 0
color = "#e8e8e8"

[widget.challenges]
# The board grouped by category: event, yours, then clan.
enabled = true
anchor = "left"
x = 10
y = 190
font_size = 0
color = "#e8e8e8"

# Category switches: repeatable = limited-time event challenges (they pay
# event currency, not XP), clan = the clan's progress, personal = your dailies
# and weeklies, completed = finished rows from any of the three.
show_repeatable = false
show_clan = true
show_personal = true
show_completed = true

# Divider naming each category; a name prefix the category shares moves up
# into it. Never drawn when only one category is on screen.
show_sections = true

# Row cap, 0 for none.
max_shown = 0

# Seconds before an unfinished deadline turns red; 0 turns that off.
urgent_within = 7200

[widget.masteries]
# Mastery levels and progress to the next one ("Melee Expert 48  512/750").
# Off by default; needs the bridge script, like the challenge board.
enabled = false

# "right" makes x an inset from the right edge.
anchor = "left"
x = 10
y = 900
font_size = 0
color = "#e8e8e8"

# MASTERED = every bonus at its cap; the boost cannot grow. Off hides those
# rows, which show green MAX instead of a fraction.
show_mastered = false

# Artisan only levels from outpost work - a dead row while you are killing.
show_artisan = false

# Show ONLY these, ignoring the two switches above. Case-insensitive, and the
# " Expert" suffix is optional: "melee" pins Melee Expert. Valid: Looter,
# Artisan, Master, Melee, Chainsaw, Pistol, Shotgun, Rifle, SMG, Machine Gun,
# Explosive. `df-hud --dump-masteries` prints yours exactly.
# Example: pin = ["Melee", "Looter"]
pin = []

# Row cap, 0 for none.
max_shown = 0

# The HTTP listener exposes every tray action for your own binds, e.g.:
#   bind = SUPER, F2, exec, curl -fsS -X POST http://127.0.0.1:9310/api/run/start
# See docs/manual-wiring.md for the endpoints.
