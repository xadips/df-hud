# df-hud configuration.
#
# Copy to ~/.config/df-hud/config.toml and edit. Every value below is the
# built-in default, so an empty file behaves exactly like this one and you only
# need to keep the lines you change.
#
# Unknown keys are a startup ERROR, not a warning - a typo would otherwise look
# like a bug in df-hud. Intervals below their minimum are errors too, rather than
# being quietly raised, because they decide how often df-hud talks to somebody
# else's server.
#
# Editing this file while df-hud is running reloads it. Three keys need a restart
# and are noted where they appear.

[df]
# The game's API root. Every request body carries your credentials, so https.
base_url = "https://fairview.deadfrontier.com/onlinezombiemmo"

# The public, unauthenticated stats feed, read for the level XP table - which is
# what makes an XP rate immune to the reset at every level-up.
allstats_url = "https://fairview.deadfrontier.com/onlinezombiemmo/dfdata/get_allstats.php?printvars=1"

# Sent on every request. Keep it honest and identifiable: it is what lets a
# server operator tell a local HUD apart from abuse, and contact you instead of
# banning you. Left commented so it stays version-stamped.
# user_agent = "df-hud/dev (+local overlay; contact via Dead Frontier forums)"

# Per-request timeout. Allowed range 2s..60s.
timeout = "10s"

# Signing salt for hashed calls (challenges). Normally leave empty: the bridge
# userscript reports the live value and a reported salt always wins, so the game
# rotating it heals itself. Set it only to work without the bridge script.
skeygen = ""

[bridge]
# The loopback listener the bridge userscript POSTs your session to. Both keys
# need a RESTART to change.
#
# This endpoint receives account-equivalent credentials, so a non-loopback
# address is refused at startup. Request bodies are never logged.
enabled = true
listen = "127.0.0.1:9275"

[poll]
# How often df-hud asks the game for your player record. active applies while the
# game is running, idle when it is not - so with only_when_game_running below,
# idle never applies at all and closing the game means zero requests.
#
# Deliberately NOT refined by whether you are in an outpost: that is only known
# from the previous poll, so it would always be one poll stale, and it would
# delay noticing the outpost-to-city transition by a whole idle interval.
#
# Minimums: active 5s, idle 30s, challenges 30s, catalog 1h. Regardless of these,
# two requests are never sent less than 5s apart, so nothing that wakes df-hud
# can turn into a burst.
active_interval = "10s"
idle_interval = "2m"

# The challenge board's cadence WHILE PLAYING. With the game closed it stretches
# to idle_interval, so a short value chosen for play cannot become an all-night
# poll if you turn only_when_game_running off.
challenge_interval = "30s"

catalog_interval = "24h"

# Fraction of the interval to randomise by, 0..0.5. Stops a restart loop from
# lining requests up and keeps the traffic from looking metronomic.
jitter = 0.10

# With this on, closing the game takes df-hud's traffic to exactly zero.
only_when_game_running = true

# Ceiling on the exponential backoff after transport failures. A rejected
# credential is not backed off from at all: polling stops until the bridge
# delivers a fresh session, because retrying a rejected login is precisely the
# pattern that earns a temp ban.
backoff_max = "5m"

[game]
# The client executable, matched against the first command-line argument's
# basename. A bare name, not a path.
#
# Detection is from /proc rather than the compositor: it decides whether df-hud
# polls at all, so it must work anywhere and must not depend on a window existing
# (a Proton game spends a while with none).
process = "DeadFrontier.exe"

# The game WINDOW's class, a different question: it decides where the HUD is
# drawn (follow_game_workspace, monitor = "auto"), never whether df-hud polls.
#
# Empty means "match by process id, failing that by a class that looks like
# game.process". Set it only if `df-hud -check-game` says the window could not be
# matched - it prints every window's class, so the fix is copying one in here.
window_class = ""

# Titles that are NOT the game even though they carry its class, matched
# case-insensitively as substrings.
#
# The launcher is why. Its configuration dialogs are the same executable, so they
# report the same class AND the same pid as the game:
#
#   class: deadfrontier.exe   title: Dead Frontier Configuration   464x406
#   class: deadfrontier.exe   title: Input Configuration           215x78
#
# An ignore list rather than a positive match on the game's own title: a required
# title would break the day they append a version to it, and the failure would be
# an invisible HUD, which looks exactly like df-hud being broken.
window_title_ignore = ["configuration"]

# How often /proc is scanned. A local read, not a network request, so there is no
# politeness floor - only sanity limits of 250ms..5m. Under Hyprland a window
# opening or closing also triggers an immediate rescan.
scan_interval = "2s"

[game_keys]
# Press a key in the game's own window at launch.
#
# One thing only: the client's FPS readout starts OFF every launch, and no
# setting anywhere remembers otherwise. The game keeps its settings in the Wine
# registry under Software\Creaky Corpse\Dead Frontier - which has the FPS cap,
# vsync, quality, brightness and HUD outlines, but nothing for this - so pressing
# the key is the only way to have it on.
#
# Off by default: df-hud synthesising input into the game is worth opting into.
# There is a tray checkbox for it too, and ticking that mid-session presses the
# key straight away.
fps_display = false

# The game's own binding, as an X keysym name. A key here rather than a constant
# so this survives rebinding it in the game, or a layout where "y" is elsewhere.
fps_key = "y"

# How long to wait after the game's own window appears - NOT after the process
# starts, which is when the launcher opens and can sit there indefinitely.
fps_delay = "5s"

# Press the launcher dialog's Play button as soon as it appears, so it flashes up
# instead of waiting for you.
#
# DISMISSED, not skipped, and the difference is not cosmetic. The dialog can be
# stopped from appearing at all - PlayerSettings.displayResolutionDialog in
# DeadFrontier_Data/mainData does it - but the dialog is ALSO what applies your
# input bindings. The game reads them from the Wine registry only as part of the
# dialog running, so skipping it silently reverts every rebind to the defaults
# baked into the build: sprint goes back to shift, and space cycles weapons.
# Measured the hard way.
#
# Turn this off when you want to reach the Input tab.
dismiss_launcher = false

# The key that activates the dialog's default button, which is Play.
launcher_key = "Return"

# Which of the launcher's windows to press it on. It has to be narrower than
# game.window_title_ignore, which contains "configuration" and so also matches
# the small "Input Configuration" key-capture box - a window with no default
# button, where Return would mean something else.
launcher_title = "Dead Frontier Configuration"

# How long to leave the dialog on screen first, so it has focus of its own
# default button before the key arrives. This is the floor on how long the dialog
# is visible, so it is deliberately short; SilverOverlays uses the same 0.5s.
launcher_delay = "500ms"

[paths]
# Holds credentials.json (0600 on Linux; protected by AppData ACLs on Windows),
# state.json and catalog.json.
# Defaults to $XDG_DATA_HOME/df-hud on Linux or
# %LOCALAPPDATA%\df-hud on Windows. Needs a RESTART to change.
# data_dir = "~/.local/share/df-hud"

[hud]
enabled = true

# Hide the HUD while the game is not running. Named to match
# poll.only_when_game_running and deliberately separate: that one governs
# requests to somebody else's server, this one governs pixels on your screen.
only_when_game_running = true

# Show the HUD only while the game's own workspace is on screen.
#
# Layer-shell has no concept of a workspace - a layer surface belongs to a
# MONITOR - so this is emulated by asking the compositor which workspace the
# game's window is on.
#
# It fails open. If the compositor cannot be reached or the window cannot be
# identified, the HUD is shown rather than hidden: a HUD that is wrongly visible
# is an annoyance you can see, one that is wrongly invisible is
# indistinguishable from df-hud being broken.
follow_game_workspace = true

# Connector name ("DP-1"), or "auto".
#
# "auto" follows the GAME: pinned to whichever monitor the game's window is on,
# re-checked every time the HUD is shown. If the window cannot be identified the
# compositor chooses, which means the focused monitor.
#
# An unknown name is a warning, not a failure: losing the HUD entirely because a
# connector got renamed after a cable swap would be a poor trade.
monitor = "auto"

# MUST be "overlay" to be visible over a fullscreen game: the "top" layer sits
# BELOW fullscreen surfaces, so a "top" HUD simply disappears when you play. The
# others exist for debugging.
layer = "overlay"

# The surface covers the whole monitor and each group carries its own x/y under
# [widget.*], so a coordinate means what it means in a screenshot. These margins
# inset the surface from each edge, which moves that origin: set margin_top to
# push everything below a bar, rather than offsetting every group.
margin_top = 0
margin_right = 0
margin_bottom = 0
margin_left = 0

# Leave this on. The HUD sits on top of the game, so every pointer event it keeps
# is one the game does not get.
click_through = true

font_family = "Courier New, monospace"
font_size = 12
text_color = "#e6cc4d"
opacity = 1.0

# Optional extra stylesheet, loaded after the built-in one. Must exist if set.
# css = "~/.config/df-hud/style.css"

[bossmap]
# What is standing on your block: bosses, bandit packs, missions, QRF events and
# outpost attacks.
#
# The only thing df-hud fetches from a site that is not the game's own. The
# game's API knows where YOU are and the stats feed knows the map's geometry, but
# neither knows what has spawned on it; dfprofiler publishes that.
#
# There is no fixed cadence. The feed states when every event starts and ends, so
# the schedule comes from the data: a fetch shortly after the next changeover,
# one when you arrive on a new block, and otherwise a heartbeat for the
# once-a-day random spawns that nothing predicts. Since each event's own times
# are read against the clock, a changeover costs no request at all.
#
# interval is the MINIMUM gap between fetches, not the cadence. The floor for
# both intervals is 15s. Nothing is fetched while the game is not running.
#
# The onslaught_ pair is the same two numbers for while you are standing in
# Onslaught, and tighter because that cycle is 300 seconds where the city's is
# 3600 - a five-minute heartbeat against a five-minute cycle can miss a whole
# turnover. dfprofiler's own page polls this endpoint every 30s per open tab,
# which is the rate worth staying near.
enabled = true
url = "https://www.dfprofiler.com/bossmap/json/"
interval = "1m"
max_interval = "5m"
onslaught_interval = "30s"
onslaught_max_interval = "1m"

[presence]
# Where you are, from the game CLIENT instead of the game server.
#
# The client publishes its own position as Discord rich presence, and df-hud
# listens by being the thing Discord would be. Discord itself is not involved and
# does not need to be running.
#
# This is not a freshness tweak, it is a better source. Measured 2026-08-16 with
# both running at once: the polled df_positionx/y lagged the client by 15-25s
# while walking AND skipped blocks entirely - one block never appeared in a
# single poll, the server jumped straight past it. The client updates on every
# block change, about every 5s at most. So the boss list, the Onslaught panel,
# the nearest-event row and the map's position ring all describe the block you
# are actually standing on rather than one you left twenty seconds ago.
#
# The poll stays authoritative for everything else - XP, HP, block support - and
# takes the position back if the client goes quiet for two minutes.
#
# Under Proton this needs the game's Discord pipe bridged to the socket; see
# knowledge/presence.md. If a real Discord or Vesktop already holds the socket,
# df-hud says so once and carries on with the polled position.
enabled = true

# Where to listen. Empty is $XDG_RUNTIME_DIR/discord-ipc-0 on Linux or
# \\.\pipe\discord-ipc-0 on Windows, which is the endpoint the game tries first.
# A custom endpoint is mainly useful with a matching bridge configuration.
socket = ""

[tray]
# The icon in the system tray (waybar's "tray" module, or any other
# StatusNotifierItem host), with a menu for hiding the overlay, reloading this
# file and quitting.
#
# Worth leaving on: with only_when_game_running above, df-hud has no presence on
# screen at all while you are not playing, and this is the only way to tell it is
# running or to stop it.
enabled = true

# --- widgets -----------------------------------------------------------------
#
# Each group has its own place on screen. x and y are pixels from the top-left,
# measured as you would on a screenshot; the defaults were set at 2560x1440
# against the game's own interface, so on another resolution they are the first
# thing to change.
#
# font_family, font_size and color are optional per group - zero, absent or empty
# means "use the [hud] values".
#
# A group's color is its NORMAL colour. The colours that carry meaning still win:
# the error banner's red, an outpost attack's red, the amber on a block with
# bandits, the amber or red on an xp rate whose polls have been landing badly.

[widget.status]
# df-hud's own error banner: stale credentials, a board it cannot fetch.
#
# No enabled key, because this is how df-hud tells you it cannot do its job. No
# color either: red when you cannot fix it, amber when you can, which is the
# whole message.
x = 10
y = 10

[widget.block]
# Where you are: the region or outpost name, and the block-support countdown.
enabled = true
x = 2340
y = 300
# font_size = 14

# Cool blue, because the amber below it means "something here can kill you".
color = "#9ecbff"

# Print the raw coordinates. Off, because the game already shows them under its
# own minimap; with it off the city head becomes the region name, which the game
# shows nowhere. Turn it on to check df-hud against the game.
show_position = false

[widget.bosses]
# What the city event feed says is on your block, one row per enemy type, plus
# the map-wide outpost attack.
#
# Its own group rather than part of block info: this list is empty on most of the
# map and seven rows long on a boss nest, so anything sharing its group would
# move up and down as you travelled.
#
# Left of block info and close under it. These rows are the longest thing the HUD
# draws - "1 x Irradiated Giant Spider" at x = 2340 finished thirteen pixels from
# the edge of a 2560-wide screen, and a group is clipped rather than wrapped.
enabled = true
x = 2240
y = 344
# font_size = 14
# color = "#ffd166"

# When your own block is empty, say which way the nearest event is:
#
#   nearest 4 up 1 left  1054, 1015
#
# Both forms on purpose: the words are what you read at a glance, the coordinates
# are what the game itself shows, so they are how you would catch "up" being the
# wrong way round. Anything past a dozen blocks is not reported.
show_nearest = true

[widget.session]
[widget.xp]
enabled = true
x = 160
y = 85
# White to match the clock, and because this sits beside the game's own
# "LV 415: 8,122,281,000" and reads as its continuation.
color = "#ffffff"
# font_size = 16
# The amber and red that say recent polls have been missing still win over this.
# color = "#9be564"
prefix = "Xp/Hr: "
# Averaging window, and the sample count below which the rate is left blank
# rather than extrapolated. The window must be long enough to hold min_samples at
# active_interval; if it is not it widens rather than being rejected, and the
# startup log says so.
#
# Five minutes, not thirty seconds, because XP arrives in lumps: a window short
# enough to contain no kill reads as a rate of zero, and a number flipping
# between 20M/hr and nothing is actively misleading. Shorten it if you want it to
# react faster and can live with it twitching.
#
# The window is reset, not averaged across, whenever the samples either side stop
# being comparable: a new run, a death, an XP boost starting or ending, a clock
# jump, or a long gap.
window = "5m"
min_samples = 3

[widget.map]
# The whole city as a grid, shaded the way DFProfiler's own map shades it: one
# cell per block, gaps left empty, district lines heavier, an identifier on every
# active event and a ring on the block you are standing on.
#
# IT STARTS HIDDEN. SUPER + ALT + M brings it up
# (POST /api/widget/map/toggle) - this is something you summon to decide where to
# walk and dismiss ten seconds later. Turning enabled off costs you the key too.
#
# The mouse passes through it to the game like any other group, which is why it
# has no hover: a map you can point at would eat the clicks you shoot with.
enabled = true

# Centre the grid on the monitor, ignoring x/y below. On by default: the right
# coordinate depends on both monitor and scale - 1180 wide at 1.0, 1475 at 1.25 -
# so a number here would need recomputing by hand every time either changed.
center = true

# Where the top-left of the grid goes when center = false.
x = 700
y = 240

# Nudge the centred map, in pixels: negative is left and up. Applied on top of
# the centring, so "60 up from centre" keeps meaning that when the scale, radius
# or monitor changes. Ignored when center = false.
offset_x = 0
offset_y = 0

# Crop to a square around you, in blocks: 15 draws 31x31, 0 is the whole city.
# The key crops to match, since a row about a boss you cannot see is a row about
# nowhere. At the full 59x55 most of the picture is somewhere you are not going.
#
# The window is clamped into the city rather than hanging off the edge, so its
# size never changes and the map does not jump sideways near a boundary. With no
# position yet, or in Onslaught, it falls back to the whole city.
radius = 0

# The size of the whole thing, grid AND key, from one number. 1.0 is 1180 pixels
# across the longest side, 20 per block at the full 59x55, a 13pt key.
#
# A pixel budget for the longest side rather than a size per block, which is what
# makes a cropped map BIGGER rather than merely smaller: the same budget over 31
# blocks gives 38px cells where 59 gives 20, so cutting the radius zooms in. The
# key's font follows the block size, so there is nothing to keep in step by hand.
scale = 1.0

# Multiplies the map's own alpha, which is already partial (0.7, their value).
# The markers are NOT faded: the point is to see through the map, not to make the
# writing on it hard to read.
opacity = 1.0

# The key beside the grid - which identifier is what, how far to walk, how long
# is left. Without it the digits in the cells mean nothing. Sorted nearest first,
# because the question is not "what is on the map" but "what can I get to".
show_list = true

# Cap on entries, 0 for no cap. 40 never triggers on a real feed - a busy cycle
# carries about thirty events - and keeps the list from running off the bottom of
# the screen, so what does not fit is COUNTED ("+3 more") rather than clipped.
max_listed = 40

# Font and colour for that list. Empty inherits from [hud].
font_family = ""
font_size = 0
color = "#e8e8e8"

[widget.challenges]
# The whole board, in the board's own order.
enabled = true
x = 10
y = 190
# font_size = 11
# Off-white rather than white: the longest column on screen, and the green and
# red it marks finished and expiring rows with need somewhere quiet to stand out
# from.
color = "#e8e8e8"

# Which parts of the board are worth a row:
#
#   show_repeatable  limited-time event challenges, currently the Summer ones.
#                    They pay event currency rather than XP, so turn this off if
#                    you are not collecting tickets.
#   show_clan        your clan's challenges. Progress that is not yours.
#   show_personal    the ordinary dailies and weeklies.
#   show_completed   cuts across all three: a finished challenge is a row that
#                    will not change again this cycle.
show_repeatable = true
show_clan = true
show_personal = true
show_completed = true

# Draw a divider naming each category:
#
#   ── clan - Weekly Challenge ──────────────────
#     Kill Infected            162,423/162,401
#
# It earns its row back: a prefix every challenge in a category shares moves up
# into the heading, so the five clan entries say "Weekly Challenge" once between
# them instead of once each. Never drawn when only one category is on screen.
show_sections = true

# Cap on rows, or 0 for no cap. The group has its own place on screen, so the
# whole board fits.
max_shown = 0

# How close a deadline has to be before an UNFINISHED challenge is drawn in the
# alarm colour, 0 to turn that off. Finished ones are green and struck through
# whatever this says.
#
# A display threshold rather than a request interval, so it has no minimum - but
# a key because "soon" depends on how you play: two hours is plenty for a daily
# kill count and nowhere near enough for a weekly you have not started.
urgent_within = "2h"

# The listener also exposes the two corrections the tray menu offers, so a key
# can do them without taking a hand off the mouse:
#
#   bind = SUPER, F2, exec, curl -fsS -X POST http://127.0.0.1:9275/api/run/start
#   bind = SUPER, F3, exec, curl -fsS -X POST http://127.0.0.1:9275/api/xp/reset
#
# /api/run/start is deliberately a trigger rather than a detector. To catch the
# click itself, Hyprland can do it without df-hud watching your input - bindn
# passes the click through to the game as well as firing:
#
#   bindn = , mouse:272, exec, ~/.config/hypr/df-run-start.sh
#
# with a script that checks the window and the screen region first. Worth knowing
# before you do: that fires on every left click, so it spawns a process per shot
# fired, and the coordinates move with your resolution and any UI change the game
# ships. A key you press as you press Start has neither problem.

[console]
# NOT BUILT YET. /api/console/toggle answers 503; these are read and validated so
# the size is yours when it lands.
#
# An ordinary window, for what a HUD group cannot be: the full challenge list
# with every objective, and diagnostics.
width = 720
height = 560
